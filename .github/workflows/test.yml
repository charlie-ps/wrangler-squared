name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

# Side by side, not nested: validate-manifest.mjs copies this checkout into a
# fake extensions dir and runs the loader's import scan over every file in it,
# so agent-wrangler must not live inside it.
defaults:
  run:
    working-directory: wrangler-squared

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AW_REPO: ${{ github.workspace }}/agent-wrangler
    steps:
      - uses: actions/checkout@v4
        with:
          path: wrangler-squared
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: PortSwigger/agent-wrangler
          ref: main
          path: agent-wrangler
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            wrangler-squared/package-lock.json
            agent-wrangler/package-lock.json

      - run: npm ci

      # No install scripts: the smoke boot opens no terminal, and node-pty ships a
      # linux-x64 prebuild for the import.
      - run: npm ci --ignore-scripts
        working-directory: agent-wrangler

      # Exits 2 if AW_REPO is not a loader checkout, so the real-loader test in
      # npm test cannot quietly fall back to skipping.
      - run: node scripts/validate-manifest.mjs

      - run: npm test

      # Boots agent-wrangler main with this checkout copied in as extensions/jobs
      # and drives it over the control WS and /mcp. No session is started; fails
      # on a quarantine, a missing frame or a missing tool.
      - run: sudo apt-get update && sudo apt-get install -y tmux

      - run: scripts/boot-smoke.sh
